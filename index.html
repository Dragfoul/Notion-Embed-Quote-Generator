<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion-style Quote Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #191919;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .quote-container {
      width: 100%;
      height: 100%;
      padding: 4vw 5vw;
      background-color: #7f7769;
      border-radius: 8px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .quote-mark {
      font-size: clamp(20px, 4vw, 36px);
      margin-bottom: 0.5em;
      color: #2e2925;
      font-weight: 500;
      line-height: 1;
    }

    .quote-text {
      font-size: clamp(14px, 2.5vw, 24px);
      line-height: 1.5;
      color: #2e2925;
      margin-bottom: 0.8em;
      font-weight: 500;
    }

    .quote-author {
      font-size: clamp(12px, 2vw, 20px);
      color: #2e2925;
      font-weight: 500;
    }

    .loading {
      opacity: 0.5;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="quote-container">
    <div class="quote-mark">❝</div>
    <div id="quoteDisplay" class="quote-text loading">Loading quote...</div>
    <div id="authorDisplay" class="quote-author"></div>
  </div>

  <script>
    const quoteDisplay = document.getElementById('quoteDisplay');
    const authorDisplay = document.getElementById('authorDisplay');

    async function fetchDailyQuote() {
      try {
        const res = await fetch('https://api.quotable.io/quotes/random?limit=1');
        if (!res.ok) throw new Error('quotable failed');
        const data = await res.json();
        showQuote(data[0].content, data[0].author);
      } catch (e) {
        try {
          const res = await fetch('https://zenquotes.io/api/random');
          if (!res.ok) throw new Error('zenquotes failed');
          const data = await res.json();
          showQuote(data[0].q, data[0].a);
        } catch (e2) {
          showQuote("The secret of getting ahead is getting started.", "Mark Twain");
        }
      }
    }

    function showQuote(text, author) {
      quoteDisplay.classList.remove('loading');
      quoteDisplay.textContent = text;
      authorDisplay.textContent = author;
    }

    fetchDailyQuote();

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') fetchDailyQuote();
    });

    window.addEventListener('pageshow', fetchDailyQuote);
  </script>
</body>
</html>
